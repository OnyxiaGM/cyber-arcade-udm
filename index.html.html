<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Fighter: Gutiérrez, Montalbán y 404 vs Zero & One</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Teko:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #0b0b12;
            color: #fff;
            user-select: none;
            overflow: hidden;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* CRT Scanline Effect */
        .crt::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 40;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
        }

        /* Sprite Standby / Idle Animations */
        @keyframes idleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .idle-hero {
            animation: idleFloat 2.2s ease-in-out infinite;
        }

        .idle-enemy {
            animation: idleFloat 2s ease-in-out infinite;
        }

        /* Attack Animations */
        @keyframes attackRight {
            0% { transform: translateX(0) scale(1); }
            40% { transform: translateX(250px) scale(1.2); }
            60% { transform: translateX(230px) scale(1.1); }
            100% { transform: translateX(0) scale(1); }
        }

        @keyframes attackLeft {
            0% { transform: translateX(0) scale(1); }
            40% { transform: translateX(-250px) scale(1.2); }
            60% { transform: translateX(-230px) scale(1.1); }
            100% { transform: translateX(0) scale(1); }
        }

        .attacking-hero {
            animation: attackRight 0.6s ease-in-out !important;
            z-index: 30;
        }

        .attacking-enemy {
            animation: attackLeft 0.6s ease-in-out !important;
            z-index: 30;
        }

        /* Damage shake */
        @keyframes hitShake {
            0%, 100% { transform: translate(0, 0); filter: brightness(1); }
            20% { transform: translate(-12px, 8px); filter: brightness(2) drop-shadow(0 0 15px red); }
            40% { transform: translate(12px, -8px); filter: brightness(3) drop-shadow(0 0 20px red); }
            60% { transform: translate(-8px, -4px); filter: brightness(2) drop-shadow(0 0 15px red); }
            80% { transform: translate(8px, 4px); filter: brightness(1.5); }
        }

        .hit-effect {
            animation: hitShake 0.5s ease-in-out;
        }

        /* Explosion */
        @keyframes explode {
            0% { opacity: 1; transform: scale(1); filter: brightness(2) hue-rotate(0deg); }
            50% { opacity: 0.8; transform: scale(1.4); filter: brightness(4) hue-rotate(90deg); }
            100% { opacity: 0; transform: scale(0); filter: brightness(10) hue-rotate(180deg); }
        }

        .exploding {
            animation: explode 1s forwards ease-out;
        }

        /* Arcade Buttons Styling */
        .arcade-btn {
            background: linear-gradient(180deg, #1f2937 0%, #111827 100%);
            border: 3px solid #f59e0b;
            box-shadow: 0 6px 0 #92400e, 0 10px 15px rgba(0,0,0,0.8);
            transition: all 0.1s ease;
        }

        .arcade-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #92400e, 0 12px 20px rgba(245, 158, 11, 0.4);
            border-color: #fbbf24;
        }

        .arcade-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #92400e, 0 4px 6px rgba(0,0,0,0.8);
        }

        /* Arcade Final Action Button (Continuar) */
        .arcade-continue-btn {
            background: linear-gradient(180deg, #f59e0b 0%, #d97706 50%, #92400e 100%);
            border: 4px solid #fef08a;
            box-shadow: 0 8px 0 #451a03, 0 14px 25px rgba(245, 158, 11, 0.6);
            transition: all 0.1s ease;
        }

        .arcade-continue-btn:hover {
            transform: translateY(-3px);
            background: linear-gradient(180deg, #fbbf24 0%, #f59e0b 50%, #b45309 100%);
            box-shadow: 0 11px 0 #451a03, 0 18px 30px rgba(245, 158, 11, 0.8);
            border-color: #ffffff;
        }

        .arcade-continue-btn:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #451a03, 0 6px 12px rgba(0,0,0,0.8);
        }

        /* Coin Insert Animation */
        @keyframes dropCoin {
            0% { transform: translateY(-80px) rotate(0deg); opacity: 1; }
            70% { transform: translateY(20px) rotate(360deg); opacity: 1; }
            100% { transform: translateY(50px) rotate(540deg); opacity: 0; }
        }

        .coin-anim {
            animation: dropCoin 0.8s ease-in forwards;
        }

        /* Glow Text */
        .text-glow-yellow {
            text-shadow: 0 0 10px #f59e0b, 0 0 20px #d97706, 0 0 30px #b45309;
        }
        .text-glow-red {
            text-shadow: 0 0 10px #ef4444, 0 0 20px #dc2626, 0 0 40px #991b1b;
        }
        .text-glow-blue {
            text-shadow: 0 0 8px #3b82f6, 0 0 16px #1d4ed8, 0 0 24px #1e40af;
        }

        /* Arcade Health Bar Gradient */
        .hp-bar-inner {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="crt">

    <script>
        // --- 10 CYBERSECURITY QUESTIONS DATA (No question numbers) ---
        const questions = [
            {
                q: "¿Cuál es el objetivo de un correo malicioso (\"phishing\")?",
                options: [
                    "Es un tipo de ataque que busca robar información, credenciales o dinero. El truco del ladrón disfrazado de cartero.",
                    "¡Un virus que se te mete en el ordenador solo con abrir un correo sin tocar ningún enlace ni descargar nada!",

            },

                    "La hipnosis acústica modulada a 432Hz. BZZZZT! Obstrucción de canal auditivo con cera. Miau."

                correct: 0 // Montalbán
            },
            {
                q: "¿Cómo reaccionar si te piden confirmar claves por teléfono?",

                correct: 1 // Gutiérrez
            },
            {
                q: "Una web te muestra un supuesto error que se soluciona \"copiando un texto y pulsando Win+R\". ¿Qué está pasando en realidad?",
                options: [

                    "La tecla Windows te ha premiado con un sorteo rápido. BZZZZT! Me encantan los premios. Miau."
                ],
                correct: 0 // Montalbán
            },
            {
                q: "Si una página web te engaña para que pegues y ejecutes un código desconocido en tu ordenador, ¿cuál es el mayor peligro?",
                options: [
                    "Que el ordenador empiece a hablar en latín y te cambie la hora a la de Tokio. ¿Qué? Yo también soy gracioso.",
                    "Que te encripten todas las carpetas de tu ordenador y no puedas acceder a tus archivos. Qué mal.",
                    "¡Error 404! Que se instale un programa espía en segundo plano para robar tus contraseñas, tarjetas y credenciales."
                ],
                correct: 2 // El Gato 404
            },
            {
                q: "Recibes una videollamada urgente de tu jefe exigiendo una transferencia bancaria inmediata. ¿Cómo debes reaccionar?",
                options: [
                    "Sospechar siempre, por mucho que le veas la cara o escuches su voz. Cuelgas de inmediato, buscas su teléfono oficial por tu cuenta y llamas directamente para verificar la orden.",
                    "¡Hacer la transferencia corriendo antes de que se enfade conmigo y enviarle luego un mensaje con un emoticono de fiesta!",
                    "Transferir todo a una wallet en criptomonedas gestionada por un bot felino. BZZZZT! Fondos desviados a compra masiva de atún. Miau."
                ],
                correct: 0 // Montalbán
            },
            {
                q: "¿Para qué sirve una 'Palabra Clave' o Safeword?",
                options: [
                    "Para autenticar la identidad por un canal alternativo ante una llamada de urgencia pidiendo dinero o claves.",
                    "¡Para desbloquear el ordenador si te has olvidado la contraseña del usuario!",
                    "Código para activar el modo fiesta en el servidor. BZZZZT! Luces LED parpadeando... Miau."
                ],
                correct: 0 // Montalbán
            },
            {
                q: "¿En qué consiste la 'Doble Extorsión'?",
                options: [
                    "Además de cifrar dispositivos, exfiltran datos confidenciales y amenazan con filtrarlos si no pagas.",
                    "¡Que te piden el doble de dinero si tardas más de diez minutos en responder al correo!",
                    "Cobrar el rescate dos veces aplicando IVA y gastos de gestión. BZZZZT! Módulo contable corrupto. Miau."
                ],
                correct: 0 // Montalbán
            },
            {
                q: "¿Cuál es la vía principal por la que el Ransomware consigue colarse en los sistemas de una empresa?",
                options: [
                    "El polvo que se acumula en las ranuras de ventilación de los servidores cuando el servicio de limpieza no pasa.",
                    "Correos de Phishing con adjuntos/enlaces maliciosos y servicios de Escritorio Remoto (RDP) expuestos sin doble factor.",
                    "Infiltración por roedores cibernéticos. BZZZZT! Mordedura de cable Ethernet por ratón de bola. Miau."
                ],
                correct: 1 // Gutiérrez
            }
        ];

        // --- GAME STATE ---
        let currentQ = 0;
        let playerHP = 100;
        let enemyHP = 100;
        let isAnimating = false;

        // --- AUDIO SYNTHESIS (Retro Sound FX) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playRetroSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, now); // B5
                osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.8);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.8);
                osc.start(now);
                osc.stop(now + 0.8);
            } else if (type === 'fatality') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.1);
                osc.frequency.setValueAtTime(659.25, now + 0.2);
                osc.frequency.setValueAtTime(880, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.7);
                osc.start(now);
                osc.stop(now + 0.7);
            }
        }

        // --- DOM ELEMENTS ---
        const questionText = document.getElementById('question-text');
        const opt0Text = document.getElementById('opt0-text');
        const opt1Text = document.getElementById('opt1-text');
        const opt2Text = document.getElementById('opt2-text');
        const qCounter = document.getElementById('q-counter');
        
        const playerHpBar = document.getElementById('player-hp');
        const enemyHpBar = document.getElementById('enemy-hp');
        const playerHpText = document.getElementById('player-hp-text');
        const enemyHpText = document.getElementById('enemy-hp-text');

        const gameOverOverlay = document.getElementById('game-over-overlay');
        const victoryOverlay = document.getElementById('victory-overlay');
        const arcadeCoin = document.getElementById('arcade-coin');
        const hitFx = document.getElementById('hit-fx');

        const heroSprites = [
            document.getElementById('sprite-montalban'),
            document.getElementById('sprite-gutierrez'),
            document.getElementById('sprite-404')
        ];
        const enemySprite = document.getElementById('sprite-enemies');

        // --- LOAD QUESTION ---
        function loadQuestion() {
            if (currentQ >= questions.length) {
                triggerVictory();
                return;
            }

            const data = questions[currentQ];
            qCounter.textContent = `ROUND ${currentQ + 1}/10`;
            questionText.textContent = data.q;
            opt0Text.textContent = data.options[0];
            opt1Text.textContent = data.options[1];
            opt2Text.textContent = data.options[2];
        }

        // --- ANSWER SUBMISSION ---
        function submitAnswer(selectedIndex) {
            if (isAnimating) return;
            isAnimating = true;

            const currentData = questions[currentQ];

            if (selectedIndex === currentData.correct) {
                // CORRECT ANSWER: Corresponding Hero Attacks Zero & One
                const attacker = heroSprites[selectedIndex];
                attacker.classList.add('attacking-hero');

                playRetroSound('hit');

                setTimeout(() => {
                    // Hit Effect & Enemy Damage
                    enemySprite.classList.add('hit-effect');
                    showHitFx();
                    
                    enemyHP = Math.max(0, enemyHP - 10);
                    updateHealthBars();

                    setTimeout(() => {
                        attacker.classList.remove('attacking-hero');
                        enemySprite.classList.remove('hit-effect');
                        
                        currentQ++;
                        isAnimating = false;

                        if (enemyHP <= 0 || currentQ >= questions.length) {
                            triggerVictory();
                        } else {
                            loadQuestion();
                        }
                    }, 500);

                }, 300);

            } else {
                // INCORRECT ANSWER: Zero & One Attacks -> INSTAKILL
                enemySprite.classList.add('attacking-enemy');
                playRetroSound('hit');

                setTimeout(() => {
                    // Hit Player Team
                    heroSprites.forEach(sprite => sprite.classList.add('hit-effect'));
                    showHitFx();

                    playerHP = 0;
                    updateHealthBars();

                    setTimeout(() => {
                        enemySprite.classList.remove('attacking-enemy');
                        heroSprites.forEach(sprite => sprite.classList.remove('hit-effect'));
                        
                        playRetroSound('gameover');
                        gameOverOverlay.classList.remove('hidden');
                        isAnimating = false;
                    }, 500);

                }, 300);
            }
        }

        // --- UPDATE HEALTH BARS ---
        function updateHealthBars() {
            playerHpBar.style.width = `${playerHP}%`;
            enemyHpBar.style.width = `${enemyHP}%`;

            playerHpText.textContent = `${playerHP} HP`;
            enemyHpText.textContent = `${enemyHP} HP`;

            if (playerHP < 30) {
                playerHpBar.classList.remove('from-green-500', 'via-yellow-400');
                playerHpBar.classList.add('from-red-600', 'to-red-500');
            } else {
                playerHpBar.classList.add('from-green-500', 'via-yellow-400');
                playerHpBar.classList.remove('from-red-600', 'to-red-500');
            }
        }

        // --- HIT FX ---
        function showHitFx() {
            hitFx.style.opacity = '1';
            setTimeout(() => { hitFx.style.opacity = '0'; }, 300);
        }

        // --- INSERT COIN (RETRY LOGIC) ---
        function triggerInsertCoin() {
            playRetroSound('coin');
            
            arcadeCoin.classList.remove('hidden');
            arcadeCoin.classList.add('coin-anim');

            setTimeout(() => {
                playerHP = 100;
                enemyHP = 100;
                currentQ = 0;
                
                updateHealthBars();
                loadQuestion();

                arcadeCoin.classList.add('hidden');
                arcadeCoin.classList.remove('coin-anim');
                gameOverOverlay.classList.add('hidden');
            }, 800);
        }

        // --- VICTORY STATE ---
        function triggerVictory() {
            playRetroSound('fatality');
            
            // Explode Enemy Sprite
            enemySprite.classList.add('exploding');

            setTimeout(() => {
                victoryOverlay.classList.remove('hidden');
            }, 1000);
        }

        // --- REDIRECTION TO SECOND GENIALLY PART ---
        function goToNextPart() {
            playRetroSound('coin');
            const targetUrl = 'https://view.genially.com/6ade550c799b7099659a25c0';
            
            // Navigate directly in the top window on the same site/tab
            setTimeout(() => {
                try {
                    window.top.location.href = targetUrl;
                } catch (e) {
                    window.location.href = targetUrl;
                }
            }, 250);
        }

        // --- INITIALIZATION ---
        window.onload = function() {
            loadQuestion();
        };
    </script>
</body>
</html>
